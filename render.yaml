services:
  - type: web
    name: pulse-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: USE_MOCK_DB
        value: "true"
      - key: DB_NAME
        value: pulse_crm
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://puls1.vercel.app,http://localhost:3000,https://localhost:3000"
      - key: WHATSAPP_VERIFY_TOKEN
        value: "pulse_crm_verify"
